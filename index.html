<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мій день</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:430px;margin:auto;padding:24px 18px}.hero{background:#c8ff22;color:#07111d;border-radius:38px;padding:24px;position:relative;margin-bottom:12px}.hero h1{margin:0 0 8px;font-size:32px;font-weight:900}.hero p{margin:0;font-size:14px}.avatar{position:absolute;right:18px;top:18px;width:50px;height:50px;border-radius:50%;background:#07111d;display:grid;place-items:center;font-size:25px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#17212d;padding:4px;border-radius:22px}.tab{border:0;background:transparent;color:#aab4c0;padding:12px;border-radius:18px;font-weight:800;font-size:15px}.tab.active{background:#c8ff22;color:#07111d;font-size:17px}.period{display:flex;align-items:center;justify-content:space-between;padding:10px 2px}.arrow{width:38px;height:38px;border:0;border-radius:50%;background:#17212d;color:#fff;font-size:24px;cursor:pointer}.date{text-align:center;font-weight:800}.stats{background:#328ce8;border-radius:38px;padding:22px;margin-bottom:7px;position:relative}.stats h2{margin:0 0 5px;color:#07111d;font-size:27px}.count{font-size:48px;font-weight:900}.ring{position:absolute;right:20px;top:28px;width:88px;height:88px;border:8px solid #a8e9d1;border-left-color:#07111d;border-radius:50%;display:grid;place-items:center;font-weight:900}.task{min-height:100px;border-radius:38px;padding:15px;display:flex;align-items:center;gap:13px;margin-bottom:6px;color:#07111d;cursor:pointer}.lime{background:#c8ff22}.pink{background:#f4b8d5}.icon{width:56px;height:56px;border-radius:18px;background:#07111d;display:grid;place-items:center;font-size:26px;color:#a8e9d1;flex:none}.info{flex:1}.title{font-size:24px;font-weight:900}.sub{font-size:12px;margin-top:5px}.check{width:44px;height:44px;border-radius:50%;border:2px solid #07111d;background:transparent;color:transparent;font-size:22px;display:grid;place-items:center;flex:none;cursor:pointer}.task.done .check{background:#07111d;color:#c8ff22}.task.done .title{text-decoration:line-through}.hint{color:#aab4c0;font-size:12px;text-align:center;margin-top:14px}
</style></head><body><div class="app">
<section class="hero"><div class="avatar">😊</div><h1>Привіт! 👋</h1><p>Сьогодні твій день для турботи про себе</p></section>
<div class="tabs"><button class="tab active">За тиждень</button><button class="tab">За місяць</button></div>
<div class="period"><button class="arrow" onclick="changeDate(-1)">‹</button><div class="date" id="date"></div><button class="arrow" onclick="changeDate(1)">›</button></div>
<section class="stats"><h2>Цей день</h2><div class="count" id="count">0 / 2</div><div>виконано справ</div><div class="ring" id="percent">0%</div></section>
<div class="task lime" onclick="toggle('workout',this)"><div class="icon">🧘</div><div class="info"><div class="title">Зарядка</div><div class="sub">Щодня · 30 хвилин для себе</div></div><button class="check" onclick="event.stopPropagation();toggle('workout',this.parentElement)">✓</button></div>
<div class="task pink" onclick="toggle('guasha',this)"><div class="icon">♡</div><div class="info"><div class="title">Масаж гуаша</div><div class="sub">Щодня · 10 хвилин турботи про себе</div></div><button class="check" onclick="event.stopPropagation();toggle('guasha',this.parentElement)">✓</button></div>
<div class="hint">Натисни на чекбокс або всю плашку — справа має відмітитися.</div></div>
<script>
let selectedDate=new Date();const state={};function key(){return selectedDate.toISOString().slice(0,10)}function update(){let d=state[key()]||{},n=(d.workout?1:0)+(d.guasha?1:0);document.getElementById('count').textContent=n+' / 2';document.getElementById('percent').textContent=n*50+'%';document.querySelectorAll('.task').forEach((e,i)=>e.classList.toggle('done',!!d[i?'guasha':'workout']))}function toggle(name,el){let k=key();state[k]??={};state[k][name]=!state[k][name];update()}function changeDate(x){selectedDate.setDate(selectedDate.getDate()+x);document.getElementById('date').textContent=new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long',year:'numeric'}).format(selectedDate);update()}changeDate(0);
</script></body></html>

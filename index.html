<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f2eb">
  <title>Мій день</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: #f8f2eb;
      color: #302c29;
    }
    .phone { max-width: 390px; min-height: 100vh; margin: auto; padding: 32px 20px; }
    .hello { color: #9a8172; font-size: 15px; margin-bottom: 8px; }
    h1 { font-size: 38px; font-weight: 500; margin: 0 0 6px; }
    .date { color: #9b938e; margin-bottom: 28px; }
    .progress {
      background: #fffaf5; border-radius: 24px; padding: 24px; text-align: center;
      box-shadow: 0 8px 25px rgba(80,55,40,.06); margin-bottom: 18px;
    }
    .number { font-size: 38px; color: #bd7659; margin-bottom: 4px; transition: .25s; }
    .progress p { margin: 0; color: #8f8782; }
    .task {
      background: #fffaf5; border-radius: 22px; padding: 20px; margin: 14px 0;
      display: flex; align-items: center; gap: 15px;
      box-shadow: 0 8px 25px rgba(80,55,40,.05);
      cursor: pointer; transition: transform .2s, opacity .2s;
    }
    .task:active { transform: scale(.98); }
    .task.done { opacity: .7; }
    .icon { width: 50px; height: 50px; border-radius: 16px; background: #f3dfd2; display: grid; place-items: center; font-size: 25px; }
    .task-info { flex: 1; }
    .task-title { font-size: 18px; margin-bottom: 5px; }
    .task-sub { color: #a08778; font-size: 14px; }
    .check {
      width: 38px; height: 38px; border-radius: 50%; border: 2px solid #c77d5d;
      color: #c77d5d; display: grid; place-items: center; font-size: 20px; transition: .2s;
    }
    .task.done .check { background: #c77d5d; color: white; }
    .note { margin-top: 24px; padding: 20px; border-radius: 22px; background: #f3e5da; color: #806d61; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="phone">
    <div class="hello">Добрий день ✨</div>
    <h1>Сьогодні</h1>
    <div class="date">20 серпня, четвер</div>

    <section class="progress">
      <div class="number" id="progress">0 / 2</div>
      <p>справ виконано</p>
    </section>

    <div class="task" onclick="toggleTask(this)">
      <div class="icon">🧘‍♀️</div>
      <div class="task-info"><div class="task-title">Зарядка</div><div class="task-sub">Щодня · 30 хвилин</div></div>
      <div class="check">✓</div>
    </div>

    <div class="task" onclick="toggleTask(this)">
      <div class="icon">♡</div>
      <div class="task-info"><div class="task-title">Масаж гуаша</div><div class="task-sub">Щодня · 10 хвилин</div></div>
      <div class="check">✓</div>
    </div>

    <div class="note" id="note">Маленькі кроки щодня — велика турбота про себе 🤍</div>
  </main>

  <script>
    function toggleTask(task) {
      task.classList.toggle('done');
      const completed = document.querySelectorAll('.task.done').length;
      document.getElementById('progress').textContent = completed + ' / 2';
      document.getElementById('note').textContent = completed === 2
        ? 'Ти зробила все на сьогодні. Пишаюся тобою 🤍'
        : 'Маленькі кроки щодня — велика турбота про себе 🤍';
    }
  </script>
</body>
</html>
